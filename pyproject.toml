[project]
name = "parla-studio"
version = "0.1.0"
description = "Dialogue leveler with voice isolation (voice-isolator), voice activity detection (SAVA) and a voice dataset builder (CrisperWhisper 2.0)."
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyside6>=6.8",
    "pyside6-fluent-widgets>=1.8",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.5",
    "sounddevice>=0.5",
    "torch>=2.8",
    "inworld-sava>=1.0",
    "inworld-voice-isolation>=1.0",
    "crisperwhisper[transformers]>=2.1.0",
    "pymss>=2.4",
    "uroman>=1.3",
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.9.8",
]

[project.scripts]
parla-studio = "parla_studio.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parla_studio"]

# PyTorch con CUDA 13.0 (RTX 3090, driver 621)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
no-cache = true
